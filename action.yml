name: " Dev PR Review Bot"
description: "Runs PR review checks and posts comments/suggestions.\n"
inputs:
  github_token:
    description: "GitHub token (usually ${{ secrets.GITHUB_TOKEN }})"
    required: true
  config:
    description: "Path to config file in repo (optional)"
    required: false
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - "${{ inputs.github_token }}"
    - "${{ inputs.config }}"
branding:
  icon: "robot"
  color: "blue"
